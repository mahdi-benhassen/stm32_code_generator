name: Generate STM32 Project (from ST GitHub sources, no CubeMX)

# Runs entirely on a normal GitHub-hosted runner — unlike a CubeMX-based
# pipeline, nothing here is gated behind a login or needs a GUI/display,
# since it only vendors source from public STMicroelectronics GitHub repos
# and writes the application code itself.
on:
  workflow_dispatch:
    inputs:
      mcu:
        description: "Target microcontroller"
        type: choice
        required: true
        default: STM32F401RETx
        options:
          - STM32F401RETx
          - STM32F411CEUx
          - STM32F103C8Tx
      project_name:
        description: "Project name"
        type: string
        default: GeneratedProject
      editor:
        description: "Editor / build integration to generate for"
        type: choice
        default: makefile
        options:
          - makefile
          - vscode
          - cubeide

      enable_usart:
        description: "Enable USART/UART"
        type: boolean
        default: true
      usart_config:
        description: 'USART config JSON'
        type: string
        default: '{"instance":"USART2","baudrate":115200,"mode":"TX_RX","parity":"NONE","stopbits":1,"wordlength":8}'

      enable_spi:
        description: "Enable SPI"
        type: boolean
        default: false
      spi_config:
        description: 'SPI config JSON'
        type: string
        default: '{"instance":"SPI1","mode":"MASTER","direction":"2LINES","data_size":8,"clk_polarity":"LOW","clk_phase":"1EDGE","nss":"SOFT","baudrate_prescaler":16}'

      enable_i2c:
        description: "Enable I2C"
        type: boolean
        default: false
      i2c_config:
        description: 'I2C config JSON'
        type: string
        default: '{"instance":"I2C1","clock_speed_hz":100000}'

      enable_can:
        description: "Enable CAN (bxCAN — only supported on STM32F103C8Tx in this catalog)"
        type: boolean
        default: false
      can_config:
        description: 'CAN config JSON'
        type: string
        default: '{"instance":"CAN1","mode":"NORMAL","prescaler":4}'

      enable_adc:
        description: "Enable ADC"
        type: boolean
        default: false
      adc_config:
        description: 'ADC config JSON'
        type: string
        default: '{"instance":"ADC1","channels":["IN0","IN1"]}'

      enable_pwm:
        description: "Enable Timer PWM"
        type: boolean
        default: false
      pwm_config:
        description: 'PWM config JSON'
        type: string
        default: '{"instance":"TIM3","channels":["CH3","CH4"],"prescaler":83,"period":999}'

      enable_freertos:
        description: "Enable FreeRTOS (CMSIS-RTOS2 wrapper, vendored from STMicroelectronics/stm32-mw-freertos)"
        type: boolean
        default: false

      commit_to_repo:
        description: "Open a PR with the generated project (so it's visible in the repo's file browser, not just a downloadable run artifact)"
        type: boolean
        default: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble configuration JSON from form inputs
        run: |
          mkdir -p build
          python3 - <<'PYEOF'
          import json, os

          def as_bool(v):
              return str(v).lower() == "true"

          cfg = {
              "project_name": os.environ["MCU_PROJECT_NAME"],
              "editor": os.environ["MCU_EDITOR"],
              "freertos": as_bool(os.environ.get("ENABLE_FREERTOS", "false")),
              "interfaces": {}
          }

          iface_map = {
              "usart": ("ENABLE_USART", "USART_CONFIG"),
              "spi":   ("ENABLE_SPI",   "SPI_CONFIG"),
              "i2c":   ("ENABLE_I2C",   "I2C_CONFIG"),
              "can":   ("ENABLE_CAN",   "CAN_CONFIG"),
              "adc":   ("ENABLE_ADC",   "ADC_CONFIG"),
              "pwm":   ("ENABLE_PWM",   "PWM_CONFIG"),
          }
          for name, (enable_var, config_var) in iface_map.items():
              cfg["interfaces"][name] = (
                  json.loads(os.environ[config_var]) if as_bool(os.environ.get(enable_var, "false")) else None
              )

          with open("build/config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          print(json.dumps(cfg, indent=2))
          PYEOF
        env:
          MCU_PROJECT_NAME: ${{ inputs.project_name }}
          MCU_EDITOR: ${{ inputs.editor }}
          ENABLE_USART: ${{ inputs.enable_usart }}
          USART_CONFIG: ${{ inputs.usart_config }}
          ENABLE_SPI: ${{ inputs.enable_spi }}
          SPI_CONFIG: ${{ inputs.spi_config }}
          ENABLE_I2C: ${{ inputs.enable_i2c }}
          I2C_CONFIG: ${{ inputs.i2c_config }}
          ENABLE_CAN: ${{ inputs.enable_can }}
          CAN_CONFIG: ${{ inputs.can_config }}
          ENABLE_ADC: ${{ inputs.enable_adc }}
          ADC_CONFIG: ${{ inputs.adc_config }}
          ENABLE_PWM: ${{ inputs.enable_pwm }}
          PWM_CONFIG: ${{ inputs.pwm_config }}
          ENABLE_FREERTOS: ${{ inputs.enable_freertos }}

      - name: Generate project (vendors ST HAL/CMSIS from GitHub + writes app code)
        run: |
          python3 scripts/generate_project.py \
            --mcu "${{ inputs.mcu }}" \
            --catalog mcu_catalog.json \
            --config build/config.json \
            --output "build/${{ inputs.project_name }}"

      - name: Install ARM GCC toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi

      # A failure in this step stops the job here (GitHub Actions default
      # behavior — later steps without `if: failure()`/`if: always()` are
      # skipped), so a broken combination can never reach the artifact
      # upload or PR steps below.
      - name: Build firmware (mandatory sanity check)
        run: |
          cd "build/${{ inputs.project_name }}"
          make

      - name: Upload generated project (downloadable run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-${{ inputs.mcu }}
          path: build/${{ inputs.project_name }}

      - name: Copy generated project into the repo
        if: ${{ inputs.commit_to_repo == 'true' }}
        run: |
          mkdir -p "generated/${{ inputs.project_name }}"
          rm -rf "generated/${{ inputs.project_name }}"
          cp -r "build/${{ inputs.project_name }}" "generated/${{ inputs.project_name }}"

      - name: Open PR with the generated project
        if: ${{ inputs.commit_to_repo == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Generate ${{ inputs.project_name }} (${{ inputs.mcu }})"
          title: "Generated project: ${{ inputs.project_name }} (${{ inputs.mcu }})"
          body: |
            Auto-generated by the `Generate STM32 Project` workflow (run #${{ github.run_number }}).

            - MCU: `${{ inputs.mcu }}`
            - Editor: `${{ inputs.editor }}`
            - FreeRTOS: `${{ inputs.enable_freertos }}`
            - Build sanity-checked in this run: yes (the workflow's "Build
              firmware" step must succeed before this PR is opened)

            Files live under `generated/${{ inputs.project_name }}/` — this is
            what makes the generated `main.c`, HAL config, linker script, etc.
            actually show up in the repo's file browser, instead of only being
            downloadable from this run's artifact.
          branch: "generated/${{ inputs.project_name }}-${{ github.run_number }}"
          add-paths: "generated/${{ inputs.project_name }}/**"
