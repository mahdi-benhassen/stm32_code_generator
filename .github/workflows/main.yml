name: CI - Test Project Generator

# Regression test for the generator itself (not the user-facing "generate a
# project on demand" workflow in generate-stm32-project.yml). Runs on every
# push/PR that touches the generator or the MCU catalog: regenerates a
# representative project for every MCU in mcu_catalog.json and actually
# compiles it, so a bad edit to generate_project.py or a bad catalog entry
# fails CI instead of silently shipping.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "mcu_catalog.json"
      - ".github/workflows/main.yml"
      - ".github/workflows/generate-stm32-project.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "mcu_catalog.json"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Syntax / lint check
        run: |
          python3 -m py_compile scripts/generate_project.py
          ruff check scripts/ --select=E9,F  # only hard errors — this generator
                                              # leans on long f-string templates
                                              # that aren't worth full-style linting

  generate-and-build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One matrix entry per catalog MCU, each exercising a different
          # combination of interfaces / GPIO model so a regression in any
          # peripheral builder or in the F1-vs-F4 GPIO branch gets caught.
          - mcu: STM32F401RETx
            project_name: CI_F401RE
            freertos: "false"
            interfaces: '{"usart":{"instance":"USART2","baudrate":115200},"i2c":{"instance":"I2C1"}}'
          - mcu: STM32F103C8Tx
            project_name: CI_BluePill
            freertos: "false"
            interfaces: '{"usart":{"instance":"USART1","baudrate":9600},"spi":{"instance":"SPI1"},"i2c":{"instance":"I2C1"},"can":{"instance":"CAN1"}}'
          - mcu: STM32F411CEUx
            project_name: CI_F411CE_Minimal
            freertos: "false"
            interfaces: "{}"
          # FreeRTOS regression coverage — one per CPU port variant
          # (ARM_CM4F vs ARM_CM3), since the SVC/PendSV/SysTick handler
          # wiring is exactly the kind of thing that compiles fine one way
          # and silently misbehaves the other.
          - mcu: STM32F401RETx
            project_name: CI_F401RE_RTOS
            freertos: "true"
            interfaces: '{"usart":{"instance":"USART2","baudrate":115200},"spi":{"instance":"SPI1"}}'
          - mcu: STM32F103C8Tx
            project_name: CI_BluePill_RTOS
            freertos: "true"
            interfaces: '{"usart":{"instance":"USART1","baudrate":9600}}'
          # Every supported interface enabled at once, per MCU — this is
          # what actually caught the F1 ADC field-mismatch bug (F1's older
          # ADC_InitTypeDef doesn't have ClockPrescaler/Resolution/
          # EOCSelection at all), since that combination hadn't been
          # exercised until it was added here.
          - mcu: STM32F401RETx
            project_name: CI_F401RE_AllInterfaces
            freertos: "false"
            interfaces: '{"usart":{"instance":"USART2","baudrate":115200},"spi":{"instance":"SPI1"},"i2c":{"instance":"I2C1"},"adc":{"instance":"ADC1","channels":["IN0","IN1"]},"pwm":{"instance":"TIM3","channels":["CH3","CH4"]}}'
          - mcu: STM32F103C8Tx
            project_name: CI_BluePill_AllInterfaces
            freertos: "false"
            interfaces: '{"usart":{"instance":"USART1","baudrate":9600},"spi":{"instance":"SPI1"},"i2c":{"instance":"I2C1"},"can":{"instance":"CAN1"},"adc":{"instance":"ADC1","channels":["IN0","IN1"]},"pwm":{"instance":"TIM3","channels":["CH3","CH4"]}}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ARM GCC toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi

      - name: Write test config
        run: |
          mkdir -p ci-build
          python3 - <<'PYEOF'
          import json, os
          cfg = {
              "project_name": os.environ["PROJECT_NAME"],
              "editor": "makefile",
              "freertos": os.environ["FREERTOS"].lower() == "true",
              "interfaces": json.loads(os.environ["IFACE_JSON"]),
          }
          with open("ci-build/config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          PYEOF
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          IFACE_JSON: ${{ matrix.interfaces }}
          FREERTOS: ${{ matrix.freertos }}

      - name: Generate project (vendors ST sources + writes app code)
        run: |
          python3 scripts/generate_project.py \
            --mcu "${{ matrix.mcu }}" \
            --catalog mcu_catalog.json \
            --config ci-build/config.json \
            --output "ci-build/${{ matrix.project_name }}"

      - name: Build firmware
        run: |
          cd "ci-build/${{ matrix.project_name }}"
          make

      - name: Report firmware size
        run: |
          arm-none-eabi-size "ci-build/${{ matrix.project_name }}/build/${{ matrix.project_name }}.elf"

      - name: Upload build output (debugging aid on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-${{ matrix.mcu }}
          path: ci-build/${{ matrix.project_name }}
